# The reference deployment. Defaults here are the ones to copy: every switch that widens access is off, the
# filesystem is read-only, the container drops every capability, and the published port is bound to host
# loopback so nothing is exposed until a reverse proxy in front chooses to expose it.
#
# Copy .env.example to .env and fill it in before using this.

x-hardening: &hardening
  # Nothing in the image needs a capability, and it never escalates privileges.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  # Without this a container's logs grow until the disk is full, which is a slow outage that looks like
  # something else by the time anybody notices.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  # PID 1 reaps nothing by default, so a leaked child would linger as a zombie.
  init: true
  restart: unless-stopped

services:
  graft:
    <<: *hardening
    # Named, so compose tags what it builds and uses what you tagged. Without this compose invents a name
    # from the directory and the service, a separately built `--tag` is never referenced, and `up` quietly
    # runs whatever it built first.
    image: ${GRAFT_IMAGE:-graft:local}
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    command:
      - --database
      - /data/graft.db
      - --repositories
      - /data/repositories
      - --listen
      - https://0.0.0.0:8443
      - --origin
      - ${GRAFT_ORIGIN}
      - --certificate
      - /run/secrets/graft-tls.pfx
      - --certificate-password-file
      - /run/secrets/graft-tls-password
      - --public-browsing
      - ${GRAFT_PUBLIC_BROWSING:-false}
      - --push-to-create
      - ${GRAFT_PUSH_TO_CREATE:-false}
      - --session-minutes
      - ${GRAFT_SESSION_MINUTES:-720}
      # The Model Context Protocol endpoint, served by the forge itself at /mcp on the same port and
      # certificate. Off unless asked for. Once on, what agents may do is set by an administrator in the
      # browser under Administration, Agent access, and changes there need no restart.
      - --mcp
      - ${GRAFT_MCP:-false}
      # Where project sites are served, on a hostname of their own. Empty means no sites: repository HTML
      # cannot share an origin with the session cookie and the API. See docs/project-pages.md.
      - --pages-origin
      - ${GRAFT_PAGES_ORIGIN:-}
      # Whether a token's secret stays readable after it is issued. Off is the only state in which a leaked
      # database is not a leaked set of credentials; see docs/decisions/0012-recoverable-tokens.md.
      - --recoverable-tokens
      - ${GRAFT_RECOVERABLE_TOKENS:-false}
      # Whether this server may make outbound HTTP requests on a project's behalf. On, a project Maintainer
      # can make it call any address it can reach, including inside this network; that is the point on a
      # self-hosted forge and is why it is the operator's switch. See docs/decisions/0016-webhooks.md.
      - --webhooks
      - ${GRAFT_WEBHOOKS:-false}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - graft-data:/data
    secrets:
      - graft-tls.pfx
      - graft-tls-password
    # Both limits live here together: compose refuses a project that sets pids_limit beside a deploy
    # resources block, because the two would be two answers to one question.
    deploy:
      resources:
        limits:
          memory: ${GRAFT_MEMORY_LIMIT:-2G}
          pids: 256
    # No healthcheck: the chiseled base carries no shell and no HTTP client, so there is nothing in the
    # image to probe with. Watch /healthz from whatever sits in front instead.

volumes:
  graft-data:

secrets:
  graft-tls.pfx:
    file: ${GRAFT_TLS_CERTIFICATE}
  graft-tls-password:
    file: ${GRAFT_TLS_PASSWORD_FILE}
