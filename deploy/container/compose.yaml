services:
  graft:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    command:
      - --database
      - /data/graft.db
      - --repositories
      - /data/repositories
      - --listen
      - https://0.0.0.0:8443
      - --origin
      - ${GRAFT_ORIGIN}
      - --certificate
      - /run/secrets/graft-tls.pfx
      - --certificate-password-file
      - /run/secrets/graft-tls-password
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - graft-data:/data
    secrets:
      - graft-tls.pfx
      - graft-tls-password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

volumes:
  graft-data:

secrets:
  graft-tls.pfx:
    file: ${GRAFT_TLS_CERTIFICATE}
  graft-tls-password:
    file: ${GRAFT_TLS_PASSWORD_FILE}
