# The reference deployment. Defaults here are the ones to copy: every switch that widens access is off, the
# filesystem is read-only, the containers drop every capability, and both published ports are bound to host
# loopback so nothing is exposed until a reverse proxy in front chooses to expose it.
#
# Copy .env.example to .env and fill it in before using this.

x-hardening: &hardening
  # Nothing in either image needs a capability, and neither ever escalates privileges.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  # Without this a container's logs grow until the disk is full, which is a slow outage that looks like
  # something else by the time anybody notices.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  # PID 1 reaps nothing by default, so a leaked child would linger as a zombie.
  init: true
  restart: unless-stopped

services:
  graft:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    command:
      - --database
      - /data/graft.db
      - --repositories
      - /data/repositories
      - --listen
      - https://0.0.0.0:8443
      - --origin
      - ${GRAFT_ORIGIN}
      - --certificate
      - /run/secrets/graft-tls.pfx
      - --certificate-password-file
      - /run/secrets/graft-tls-password
      - --public-browsing
      - ${GRAFT_PUBLIC_BROWSING:-false}
      - --push-to-create
      - ${GRAFT_PUSH_TO_CREATE:-false}
      - --session-minutes
      - ${GRAFT_SESSION_MINUTES:-720}
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        # The MCP service reaches the forge by the name on its certificate, not by the service name, because
        # the certificate is checked and a service name would not match a subject alternative name.
        aliases:
          - ${GRAFT_INTERNAL_HOST:-graft.internal}
    volumes:
      - graft-data:/data
    secrets:
      - graft-tls.pfx
      - graft-tls-password
    # Both limits live here together: compose refuses a project that sets pids_limit beside a deploy
    # resources block, because the two would be two answers to one question.
    deploy:
      resources:
        limits:
          memory: ${GRAFT_MEMORY_LIMIT:-512M}
          pids: 256
    # No healthcheck: the chiseled base carries no shell and no HTTP client, so there is nothing in the
    # image to probe with. Watch /healthz from whatever sits in front instead.

  # Off unless asked for: `docker compose --profile mcp up`. A profile rather than a flag inside the forge,
  # because the MCP server is a separate process and an operator who does not want agent access should have
  # nothing listening rather than a route switched off.
  graft-mcp:
    <<: *hardening
    profiles:
      - mcp
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    entrypoint:
      - /app/mcp/Graft.Mcp
    command:
      - --server
      - https://${GRAFT_INTERNAL_HOST:-graft.internal}:8443
      - --transport
      - http
      - --listen
      - https://0.0.0.0:8444
      - --certificate
      - /run/secrets/graft-tls.pfx
      - --certificate-password-file
      - /run/secrets/graft-tls-password
      # The forge's own certificate, so this verifies it rather than trusting whatever answers. There is no
      # option anywhere that skips the check.
      - --ca-certificate
      - /run/secrets/graft-ca.pem
      # Reads only unless an operator says otherwise. This holds no credential of its own: every caller
      # sends their own Graft token, so this bounds what any of them can do through it.
      - --allow-writes
      - ${GRAFT_MCP_ALLOW_WRITES:-false}
      # Callers must present a Graft token. Turning this on serves people who present nothing, who then
      # reach Graft as strangers and see only what is public. Deliberate, narrow, and off by default.
      - --allow-anonymous
      - ${GRAFT_MCP_ALLOW_ANONYMOUS:-false}
    ports:
      - "127.0.0.1:8444:8444"
    depends_on:
      - graft
    secrets:
      - graft-tls.pfx
      - graft-tls-password
      - graft-ca.pem
    deploy:
      resources:
        limits:
          memory: ${GRAFT_MCP_MEMORY_LIMIT:-256M}
          pids: 128

volumes:
  graft-data:

secrets:
  graft-tls.pfx:
    file: ${GRAFT_TLS_CERTIFICATE}
  graft-tls-password:
    file: ${GRAFT_TLS_PASSWORD_FILE}
  # Only read by the MCP service. Compose resolves every secret's source whichever profile is active, so
  # this falls back to the certificate file and an operator who never enables MCP never needs a second one.
  graft-ca.pem:
    file: ${GRAFT_CA_CERTIFICATE:-${GRAFT_TLS_CERTIFICATE}}
